name: Release Samsung APK
on:
  push:
    tags: ['v*-samsung.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to verify without publishing (empty reads gradle.properties)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: samsung-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'gbettineschi/BetterNightLight-Samsung'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release source, version and notes
        id: version
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release-check.py version --tag "$TAG" >> "$GITHUB_OUTPUT"
          python3 scripts/release-check.py notes --tag "$TAG" > "$RUNNER_TEMP/release-notes.md"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Install the required Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Restore retained owner signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          if not os.environ.get('KEYSTORE_BASE64'):
              raise SystemExit('The retained owner signing key is required.')
          key = Path(os.environ['RUNNER_TEMP']) / 'samsung-release.p12'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SIGNING_STORE_FILE={key}\n')
          PYCODE
      - name: Test, lint and build signed release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest lintRelease assembleRelease --console=plain
      - name: Load previous published APK for the update check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$RUNNER_TEMP/published-releases.json"
          previous=$(python3 - "$RUNNER_TEMP/published-releases.json" <<'PYCODE'
          import json, sys
          pages = json.load(open(sys.argv[1]))
          releases = [r for page in pages for r in page if not r['draft'] and r.get('published_at')]
          print(max(releases, key=lambda r: r['published_at'])['tag_name'] if releases else '')
          PYCODE
          )
          if [[ -n "$previous" ]]; then
            test "$previous" != "$TAG"
            mkdir -p "$RUNNER_TEMP/previous-apk"
            gh release download "$previous" --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          fi
      - name: Verify and stage the one installable APK
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          apk="dist/BetterNightLight-Samsung-$VERSION.apk"
          cp "${apks[0]}" "$apk"
          extra=()
          if [[ -d "$RUNNER_TEMP/previous-apk" ]]; then
            extra=(--previous-dir "$RUNNER_TEMP/previous-apk")
          fi
          python3 scripts/release-check.py verify "$apk" --tag "$TAG" "${extra[@]}" > dist/release.json
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - name: Publish tagged release for Obtainium
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/release.json \
            --verify-tag --latest --title "${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/samsung-release.p12"
